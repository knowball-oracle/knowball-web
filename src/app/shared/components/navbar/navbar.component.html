<button
  type="button"
  class="fixed left-4 top-4 z-50 rounded-xl p-2 text-white/60 transition hover:text-white md:hidden glass"
  (click)="mobileOpen = !mobileOpen"
  aria-label="Menu"
>
  <lucide-icon [img]="mobileOpen ? CloseIcon : MenuIcon" size="20" />
</button>

@if (mobileOpen) {
  <div class="fixed inset-0 z-30 bg-black/50 md:hidden" (click)="mobileOpen = false"></div>
}

<aside
  class="app-navbar fixed left-0 top-0 z-40 flex h-full w-60 flex-col glass-liquid transition-transform duration-300 md:translate-x-0"
  [class.-translate-x-full]="!mobileOpen"
  [class.translate-x-0]="mobileOpen"
>
  <!-- Logo -->
  <div class="border-b border-white/10 py-3 pl-12 pr-3 md:pl-3">
    <a routerLink="/dashboard" (click)="mobileOpen = false">
      <img src="/assets/logo.svg" alt="Knowball" class="logo-adaptive mt-2 h-8 w-auto" />
    </a>
  </div>

  <!-- Navegação -->
  <nav class="flex-1 space-y-0.5 overflow-y-auto px-3 py-4">
    @for (link of links; track link.path) {
      @if (link.path !== '/users' || auth.isAdmin()) {
        <a
          [routerLink]="link.path"
          routerLinkActive="bg-white/10 text-white"
          [routerLinkActiveOptions]="{ exact: link.path === '/dashboard' }"
          class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-white transition-all duration-200 hover:bg-white/5 hover:text-white"
          (click)="mobileOpen = false"
        >
          <lucide-icon [img]="link.icon" size="17" />
          <span>{{ link.label }}</span>
        </a>
      }
    }
  </nav>

  <!-- Perfil, logout e alternância de tema -->
  <div class="navbar-profile border-t border-white/8 px-3 pb-3 pt-2">
    <div class="flex items-center gap-2 py-1.5">
      <a
        routerLink="/profile"
        (click)="mobileOpen = false"
        class="flex min-w-0 flex-1 items-center gap-2.5 rounded-xl px-2 py-1.5 transition-all duration-200 hover:bg-white/5"
        aria-label="Abrir perfil"
      >
        <!-- Avatar -->
        <div
          class="flex h-8 w-8 shrink-0 items-center justify-center overflow-hidden rounded-full border"
          [class.bg-orange-500/20]="!photo()"
          [class.border-orange-500/30]="!photo()"
          [class.border-transparent]="!!photo()"
        >
          @if (photo()) {
            <img [src]="photo()" alt="Foto de perfil" class="h-full w-full object-cover" />
          } @else {
            <span class="text-xs font-bold text-orange-400">
              {{ initials() }}
            </span>
          }
        </div>

        <!-- Nome e perfil -->
        <div class="min-w-0 flex-1">
          <p class="truncate text-sm font-medium leading-tight text-white/80">
            {{ user()?.name || 'Usuário' }}
          </p>

          @if (auth.isAdmin()) {
            <span class="text-xs leading-tight text-purple-400"> ADMIN </span>
          } @else {
            <span class="text-xs leading-tight text-white/30"> USER </span>
          }
        </div>
      </a>

      <!-- Sair -->
      <button
        type="button"
        (click)="logout()"
        title="Sair"
        aria-label="Sair da conta"
        class="shrink-0 cursor-pointer rounded-lg p-1.5 text-white/25 transition-all duration-200 hover:bg-red-500/10 hover:text-red-400"
      >
        <lucide-icon [img]="LogOutIcon" size="16" />
      </button>
    </div>

    <!-- Separador -->
    <div class="mx-2 mb-2 h-px bg-white/5"></div>

    <!-- Alternador de tema -->
    <div class="flex justify-center py-1">
      <button
        type="button"
        (click)="themeService.toggle()"
        [title]="themeService.isDark() ? 'Mudar para tema claro' : 'Mudar para tema escuro'"
        [attr.aria-label]="
          themeService.isDark() ? 'Mudar para tema claro' : 'Mudar para tema escuro'
        "
        class="navbar-theme-toggle theme-pill"
        [class.theme-pill-light]="!themeService.isDark()"
      >
        <span class="theme-pill-icon" [class.theme-pill-icon-active]="!themeService.isDark()">
          <lucide-icon [img]="SunIcon" size="12" />
        </span>

        <span
          class="theme-pill-thumb"
          [class.theme-pill-thumb-right]="!themeService.isDark()"
        ></span>

        <span class="theme-pill-icon" [class.theme-pill-icon-active]="themeService.isDark()">
          <lucide-icon [img]="MoonIcon" size="12" />
        </span>
      </button>
    </div>
  </div>
</aside>
