<div class="mx-auto w-full max-w-3xl px-4 py-8 sm:px-6 sm:py-12 md:py-16">

  <header class="text-center">
    <p class="kb-mono text-xs font-semibold uppercase tracking-[0.14em] text-[#F87171]">FAQ</p>

    <h1
      class="mt-5 text-[1.95rem] font-extrabold min-[420px]:text-[2.5rem] leading-[1.1] tracking-[-0.04em] text-white sm:text-6xl"
    >
      Ficou com dúvidas?
      <span
        class="mx-auto mt-2 block w-fit bg-[#F87171] px-3 pb-2 pt-0.5 text-[#0A0A0A] min-[420px]:px-4 sm:px-6 sm:pb-3"
      >
        A gente responde.
      </span>
    </h1>

    <p class="mx-auto mt-6 max-w-xl text-base leading-7 text-[#A3A3A3] sm:text-lg sm:leading-8">
      Reunimos as perguntas mais comuns sobre como o Knowball funciona e como acompanhar suas
      denúncias.
    </p>
  </header>

  <div
    class="mt-10 divide-y divide-[#303030] overflow-hidden rounded-[14px] border border-[#303030] bg-[#141414] sm:mt-12"
  >
    @for (item of items; track item.id) {
      <article
        class="transition-colors duration-200"
        [ngClass]="isOpen(item.id) ? 'bg-[#1A1A1A]' : ''"
      >
        <h2>
          <button
            type="button"
            [id]="'faq-trigger-' + item.id"
            (click)="toggle(item.id)"
            [attr.aria-expanded]="isOpen(item.id)"
            [attr.aria-controls]="'faq-panel-' + item.id"
            class="group flex min-h-16 w-full cursor-pointer items-center gap-4 px-4 py-5 text-left transition-colors duration-200 hover:bg-[#1A1A1A] focus-visible:outline-2 focus-visible:-outline-offset-2 focus-visible:outline-[#F87171] sm:gap-5 sm:px-6"
          >
            <span
              class="kb-mono w-6 shrink-0 text-xs font-semibold transition-colors"
              [ngClass]="isOpen(item.id) ? 'text-[#F87171]' : 'text-[#A3A3A3]'"
              aria-hidden="true"
            >
              {{ item.id < 10 ? '0' + item.id : item.id }}
            </span>

            <span
              class="flex-1 text-base font-semibold leading-snug tracking-[-0.01em] text-white sm:text-lg"
            >
              {{ item.question }}
            </span>

            <span
              class="inline-flex h-9 w-9 shrink-0 items-center justify-center rounded-[10px] border transition-colors duration-200"
              [ngClass]="
                isOpen(item.id)
                  ? 'border-[#F87171] bg-[#F87171] text-[#0A0A0A]'
                  : 'border-[#303030] bg-[#0A0A0A] text-[#A3A3A3] group-hover:border-[#F87171] group-hover:text-[#F87171]'
              "
            >
              <lucide-icon
                [img]="PlusIcon"
                size="18"
                class="inline-flex transition-transform duration-300 motion-reduce:transition-none"
                [ngClass]="isOpen(item.id) ? 'rotate-45' : ''"
              />
            </span>
          </button>
        </h2>

        <div
          [id]="'faq-panel-' + item.id"
          role="region"
          [attr.aria-labelledby]="'faq-trigger-' + item.id"
          [attr.aria-hidden]="!isOpen(item.id)"
          class="grid transition-[grid-template-rows] duration-300 ease-out motion-reduce:transition-none"
          [ngClass]="isOpen(item.id) ? 'grid-rows-[1fr]' : 'grid-rows-[0fr]'"
        >
          <div class="overflow-hidden">
            <p
              class="max-w-2xl pb-6 pl-14 pr-6 text-base leading-7 text-[#A3A3A3] sm:pl-17 sm:pr-16"
            >
              {{ item.answer }}
            </p>
          </div>
        </div>
      </article>
    }
  </div>
</div>
