<div class="mx-auto w-full max-w-3xl px-4 py-8 sm:px-6 sm:py-12 md:py-16">
  <header class="text-center">
    <p class="text-[11px] font-semibold uppercase tracking-[0.2em] text-white/40">FAQ</p>

    <h1
      class="mt-3 text-3xl font-bold leading-tight tracking-tight text-white sm:text-4xl md:text-5xl"
    >
      Ficou com dúvidas?

      <span class="block text-white/50">A gente responde.</span>
    </h1>

    <p class="mx-auto mt-4 max-w-xl text-sm leading-relaxed text-white/50 sm:text-base">
      Reunimos as perguntas mais comuns sobre como o Knowball funciona e como acompanhar suas
      denúncias.
    </p>
  </header>

  <div class="mt-8 divide-y divide-white/10 border-y border-white/10 sm:mt-10">
    @for (item of items; track item.id) {
      <article
        class="transition-colors duration-200"
        [ngClass]="isOpen(item.id) ? 'bg-white/2.5' : ''"
      >
        <h2>
          <button
            type="button"
            [id]="'faq-trigger-' + item.id"
            (click)="toggle(item.id)"
            [attr.aria-expanded]="isOpen(item.id)"
            [attr.aria-controls]="'faq-panel-' + item.id"
            class="group flex min-h-14 w-full cursor-pointer items-center justify-between gap-6 px-3 py-5 text-left transition-colors duration-200 hover:bg-white/2.5 sm:px-4"
          >
            <span
              class="text-base font-semibold leading-snug text-white/85 transition-colors group-hover:text-white sm:text-lg"
            >
              {{ item.question }}
            </span>

            <lucide-icon
              [img]="PlusIcon"
              size="18"
              class="inline-flex shrink-0 text-white/45 transition-transform duration-300 group-hover:text-white/80 motion-reduce:transition-none"
              [ngClass]="isOpen(item.id) ? 'rotate-45 text-white/90' : ''"
            />
          </button>
        </h2>

        <div
          [id]="'faq-panel-' + item.id"
          role="region"
          [attr.aria-labelledby]="'faq-trigger-' + item.id"
          [attr.aria-hidden]="!isOpen(item.id)"
          class="grid transition-[grid-template-rows] duration-300 ease-out motion-reduce:transition-none"
          [ngClass]="isOpen(item.id) ? 'grid-rows-[1fr]' : 'grid-rows-[0fr]'"
        >
          <div class="overflow-hidden">
            <p
              class="max-w-2xl px-3 pb-5 pr-8 text-sm leading-7 text-white/70 sm:px-4 sm:pr-12 sm:text-base"
            >
              {{ item.answer }}
            </p>
          </div>
        </div>
      </article>
    }
  </div>
</div>
