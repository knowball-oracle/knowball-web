<div
  class="mx-auto w-full max-w-3xl px-4 py-8 text-slate-900! sm:px-6 sm:py-12 md:py-16 dark:text-white!"
>
  <header class="text-center">
    <p
      class="text-[11px]! font-semibold! uppercase tracking-[0.2em] text-slate-500! dark:text-white/40!"
    >
      FAQ
    </p>

    <h1
      class="mt-3 text-3xl! font-bold! leading-tight! tracking-tight! text-slate-950! sm:text-4xl! md:text-5xl! dark:text-white!"
    >
      Ficou com dúvidas?

      <span class="block text-slate-600! dark:text-white/50!"> A gente responde. </span>
    </h1>

    <p
      class="mx-auto mt-4 max-w-xl text-sm! leading-relaxed! text-slate-600! sm:text-base! dark:text-white/50!"
    >
      Reunimos as perguntas mais comuns sobre como o Knowball funciona e como acompanhar suas
      denúncias.
    </p>
  </header>

  <div
    class="mt-8 divide-y! divide-slate-200! border-y! border-slate-200! sm:mt-10 dark:divide-white/10! dark:border-white/10!"
  >
    @for (item of items; track item.id) {
      <div>
        <h2>
          <button
            type="button"
            [id]="'faq-trigger-' + item.id"
            (click)="toggle(item.id)"
            [attr.aria-expanded]="isOpen(item.id)"
            [attr.aria-controls]="'faq-panel-' + item.id"
            class="group flex min-h-14 w-full cursor-pointer items-center justify-between gap-6 py-5 text-left"
          >
            <span
              class="text-base! font-semibold! leading-snug! text-slate-800! transition-colors group-hover:text-slate-950! sm:text-lg! dark:text-white/85! dark:group-hover:text-white!"
            >
              {{ item.question }}
            </span>

            <lucide-icon
              [img]="PlusIcon"
              size="18"
              class="inline-flex shrink-0 text-slate-500! transition-transform duration-300 group-hover:text-slate-950! dark:text-white/45! dark:group-hover:text-white/80! motion-reduce:transition-none"
              [ngClass]="isOpen(item.id) ? 'rotate-45 text-slate-950! dark:text-white/90!' : ''"
            />
          </button>
        </h2>

        <div
          [id]="'faq-panel-' + item.id"
          role="region"
          [attr.aria-labelledby]="'faq-trigger-' + item.id"
          [attr.aria-hidden]="!isOpen(item.id)"
          class="grid transition-[grid-template-rows] duration-300 ease-out motion-reduce:transition-none"
          [ngClass]="isOpen(item.id) ? 'grid-rows-[1fr]' : 'grid-rows-[0fr]'"
        >
          <div class="overflow-hidden">
            <p
              class="max-w-2xl pb-5 pr-8 text-sm! leading-7! text-slate-700! sm:pr-12 sm:text-base! dark:text-white/65!"
            >
              {{ item.answer }}
            </p>
          </div>
        </div>
      </div>
    }
  </div>
</div>
